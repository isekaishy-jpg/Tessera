[package]
name = "tessera-vk-smoke"
version = "0.1.0"
description = "Driver smoke test of tessera-vk under the Vulkan validation layer."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tessera-vk = { path = "../vk" }

[dev-dependencies]
trybuild = "1"

# wg's full gate runs every other test target under Miri; these spawn processes, which Miri
# cannot run.
[package.metadata.miri]
skip = ["compile_fail", "smoke"]

[lints]
workspace = true
