[package]
name = "tessera-vk"
version = "0.1.0"
description = "Tessera's Vulkan bindings, generated from the pinned Vulkan SDK registry."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "tessera_vk"

[dev-dependencies]
trybuild = "1"

# wg's full gate runs every other test target under Miri; these spawn processes, which Miri
# cannot run.
[package.metadata.miri]
skip = ["compile_fail", "layout"]

[lints]
workspace = true
